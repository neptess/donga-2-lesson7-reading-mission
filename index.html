<style>
/* Layout: one page at a time. Student tablet = narrow card; teacher projector = wide sentence + code + scoreboard. Stage colors: curtain red, bean green, rain blue. */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#dde2de;
  --s1:#b23a2e; --s2:#3d7a37; --s3:#2c6aa3; --gold:#c98a12;
  --ok:#23824a; --okbg:#e5f4ea; --bad:#c2362b; --badbg:#fbe9e7; --hl:#fff3c4;
  --f-display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --stage:var(--s1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141816; --card:#1d2220; --ink:#e9ede9; --muted:#9aa5a0; --line:#323a36;
  --s1:#e2695c; --s2:#74b56b; --s3:#62a2dd; --gold:#e3aa3c;
  --ok:#5fc585; --okbg:#173325; --bad:#ef7468; --badbg:#3a1d1a; --hl:#4a3f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141816; --card:#1d2220; --ink:#e9ede9; --muted:#9aa5a0; --line:#323a36;
  --s1:#e2695c; --s2:#74b56b; --s3:#62a2dd; --gold:#e3aa3c;
  --ok:#5fc585; --okbg:#173325; --bad:#ef7468; --badbg:#3a1d1a; --hl:#4a3f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1280px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.8rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.who{font-size:.85rem;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--stage);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0;flex:1 1 120px}
select,input.t{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.note{font-size:.85rem;color:var(--muted)}
.lv{color:var(--stage);font-weight:600;font-size:.8rem;letter-spacing:.08em}
/* code entry */
.codebox{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.codebox input{font-family:var(--f-en);font-size:2rem;letter-spacing:.4em;text-align:center;width:9ch;padding:6px 4px 6px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.codebox .btn{font-size:1.05rem}
/* sentence card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.see{gap:8px}
.no{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.star{color:var(--gold);font-weight:700}
.en{font-family:var(--f-en);font-size:1.15rem;line-height:2.1}
.ko{color:var(--muted);line-height:2}
.ex{font-size:.95rem;line-height:2;padding:6px 10px;background:var(--paper);border-radius:8px}
input.blank{font-family:var(--f-en);font-size:1rem;border:0;border-bottom:2px solid var(--stage);background:transparent;color:var(--ink);padding:0 4px;text-align:center;min-width:3.5em;border-radius:0}
input.blank:disabled{border-bottom-style:dashed;opacity:.8}
.ko input.blank,.ex input.blank{font-family:var(--f-body)}
.form em{font-style:normal;font-size:.85em;color:var(--stage);margin-right:2px}
.given{font-family:var(--f-en);color:var(--stage);font-weight:700}
select.dd{width:auto;max-width:100%;padding:1px 6px;font-family:var(--f-en);font-size:1rem;border:2px solid var(--stage);border-radius:8px;vertical-align:middle;background:var(--card)}
.ex select.dd{font-family:var(--f-body)}
.wrong{text-decoration:underline wavy var(--bad);text-decoration-thickness:2px;text-underline-offset:5px;font-weight:700}
.choice{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:0 9px;line-height:1.9;font-size:.95em}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--stage);background:var(--stage);color:#fff}
.good{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ink)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important;color:var(--ink)!important}
.fixrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.fixrow input{max-width:150px}
.role{border-radius:12px;padding:14px 16px;font-weight:600;font-size:1.05rem}
.role.other{background:var(--paper);border:1px dashed var(--line)}
/* level picker */
.lvpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvpick button{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.35}
.lvpick button b{font-family:var(--f-display);font-size:1.6rem;font-weight:400}
.lvpick button span{font-size:.78rem;color:var(--muted)}
.lvpick button.sel{border-color:var(--stage);background:var(--stage);color:#fff}
.lvpick button.sel span{color:#fff}
.lvpick button:disabled{cursor:default}
.lvpick button:disabled:not(.sel){opacity:.4}
.result{text-align:center;border-radius:16px;padding:18px 12px;font-family:var(--f-display);font-size:2.6rem;line-height:1.1}
.result small{display:block;font-family:var(--f-body);font-size:1rem;margin-top:6px}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.no{background:var(--badbg);color:var(--bad)}
mark{background:var(--hl);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:700}
.hint{font-size:.95rem;background:var(--hl);border-radius:8px;padding:8px 12px}
.talkbox{border-radius:12px;padding:12px 16px;background:var(--paper);border:1px dashed var(--line);font-weight:600}
.talkbox.me{background:var(--gold);color:#1d2321;border:0}
.talkbox .frame{font-weight:400;margin-top:6px;font-size:1.05rem}
.talkbox .kw{font-weight:400;font-size:.9rem;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
/* teacher */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.proj .en{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.9}
.proj .ko{font-size:clamp(1rem,1.6vw,1.3rem)}
.slot{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--stage);text-align:center;color:var(--stage);font-weight:700}
.slot.c{border:0;min-width:0;font-weight:400;color:var(--ink)}
.slotbtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:6px}
.slotbtn:hover .slot{background:var(--hl)}
.bigcode{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--stage);color:#fff;border-radius:14px;padding:12px 18px}
.bigcode b{font-family:var(--f-en);font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:.25em;font-variant-numeric:tabular-nums}
.bigcode .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{min-width:34px;padding:3px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:.8rem;font-variant-numeric:tabular-nums}
.nav button.see{border-style:dashed;color:var(--muted)}
.nav button.talk::after{content:" 🎤";font-size:.75em}
.nav button.cur{background:var(--stage);border-color:var(--stage);border-style:solid;color:#fff}
.nav button.seen{border-color:var(--stage)}
.nav .sep{width:100%;font-size:.75rem;color:var(--muted);margin-top:4px}
.talklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.score{display:flex;flex-direction:column;gap:6px}
.sc{display:grid;grid-template-columns:4.5em 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.sc .g{font-weight:600}
.sc .pts{font-family:var(--f-en);font-weight:700;font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.sc .bs{display:flex;gap:4px;align-items:center}
.sc .bs button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.85rem}
.sc.lead{border-color:var(--gold)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--stage)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.conn{border-radius:10px;padding:8px 12px;background:var(--hl);font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conn.bad{background:var(--badbg);color:var(--bad)}
input.code4{font-family:var(--f-en);font-size:1.8rem;letter-spacing:.35em;text-align:center;max-width:8ch}
.qrmini{border:0;padding:4px;background:#fff;border-radius:8px;line-height:0;width:76px;height:76px;flex:none}
.qrmini svg{width:100%;height:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.qrbig{background:#fff;color:#1d2321;border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:92vw}
.qrbig svg{width:min(70vh,80vw);height:auto}
.qrbig b{font-family:var(--f-en);font-size:3rem;letter-spacing:.25em}
.qrbig span{font-size:.85rem;word-break:break-all;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* 모든 문항을 한 줄로 */
const ITEMS=[];STAGES.forEach(sg=>sg.sents.forEach(s=>ITEMS.push(Object.assign({stage:sg,quiz:QUIZ.includes(s.id)},s))));
/* 화면(페이지) 만들기: 문제 문장은 한 화면에 하나, 이어지는 확인 문장은 최대 SEE_MAX개씩 고르게 나눠 묶기 */
const PAGES=[];(()=>{let run=[];
  const flush=()=>{if(!run.length)return;const k=Math.ceil(run.length/SEE_MAX),base=Math.floor(run.length/k),extra=run.length%k;let at=0;
    for(let j=0;j<k;j++){const n=base+(j<extra?1:0);PAGES.push({see:true,items:run.slice(at,at+n)});at+=n}run=[]};
  ITEMS.forEach((it,i)=>{if(it.quiz){flush();PAGES.push({see:false,items:[i]})}else{if(run.length&&ITEMS[run[0]].stage!==it.stage)flush();run.push(i)}});flush()})();
const NP=PAGES.length;
const first=pg=>ITEMS[PAGES[pg].items[0]];

/* ================== 유틸 ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[.!?,]+$/,"").replace(/\s+/g," ").trim();
const TOK=/\[\[(.+?)\]\]|\{\{(.+?)\}\}|<<(.+?)>>/g;
const split2=(str,ch)=>{const i=str.indexOf(ch);return i<0?[str,""]:[str.slice(0,i),str.slice(i+1)]};
function parse(tpl){const out=[];let last=0,m;TOK.lastIndex=0;
  while((m=TOK.exec(tpl))){if(m.index>last)out.push({t:tpl.slice(last,m.index)});
    if(m[1]){const [a,d]=split2(m[1],"~");out.push({k:"in",ans:a.split("|"),d:d?d.split("/"):[]})}
    else if(m[2]){const i=m[2].lastIndexOf("=");out.push({k:"ch",opts:m[2].slice(0,i).split("/"),ans:m[2].slice(i+1).split("|")})}
    else{const [b,rest]=split2(m[3],"=");const [a,d]=split2(rest,"~");out.push({k:"fm",base:b,ans:a.split("|"),d:d?d.split("/"):[]})}
    last=TOK.lastIndex}
  if(last<tpl.length)out.push({t:tpl.slice(last)});return out}
/* 문장의 모든 칸: lev=수준에 따라 모양이 바뀌는 칸 (한글 줄 보기 고르기는 그대로) */
function unitsOf(s){const u=[];["en","ex","ko"].forEach(p=>{if(!s[p])return;let i=0;parse(s[p]).forEach(seg=>{if(seg.k)u.push({seg,key:`${s.id}-${p}-${i++}`,lev:seg.k!=="ch"||p==="en"})})});return u}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800)}
const label=s=>typeof s.id==="number"?`${s.id}번 문장`:`내용 확인 ${s.id}`;
/* 해시: 같은 코드면 모든 기기가 같은 결과를 계산 (연결 불필요) */
function h(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
const shuf=(arr,seed)=>arr.map(v=>[h(seed+"|"+v),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const setStage=s=>document.documentElement.style.setProperty("--stage",`var(${s.stage.c})`);
/* 중 수준: 여러 단어 답이면 한 단어를 보여 줌 (2단어 → 첫 단어, 3단어 이상 → 가운데 단어) */
const givenIdx=words=>words.length===2?0:Math.floor(words.length/2);

/* ================== 연결 (PeerJS · 서버 없음) ==================
   선생님 화면이 방을 열고 채점·진행을 맡아요. 학생 태블릿은 입장 코드로 선생님 화면에 직접 연결돼요.
   수업 중에는 선생님 화면을 닫지 마세요 (새로고침은 괜찮아요). */
const PREFIX="idiom-reading-mission-v1-";
const mkey=(g,n)=>`g${g}n${n}`;
const roomOk=r=>/^\d{4}$/.test(r);
const rid=()=>Math.random().toString(36).slice(2,8);
const newRoom=()=>String(1000+Math.floor(Math.random()*9000));
const HAS_PEER=typeof Peer==="function";
const joinURL=code=>location.origin+location.pathname+"?c="+code;

/* ================== 저장 (기기별) ================== */
function loadKey(k,def){try{const r=JSON.parse(localStorage.getItem(k));if(r)return r}catch(e){}return def}
function saveKey(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* 미리보기용: 주소에 ?as=1 처럼 붙이면 같은 브라우저 탭마다 다른 학생으로 저장 */
const AS=(new URLSearchParams(location.search).get("as")||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,10);
const SKEY="irm-student-v1"+(AS?"-"+AS:"");
let S=loadKey(SKEY,{profile:null,val:{},res:{},lv:{}});
let T=loadKey("irm-teacher-v1",{quota:true,groups:7,page:0,code:null,reveal:false,open:{},tip:false,pick:null,talkX:{},room:null});
S.val=S.val||{};S.res=S.res||{};S.lv=S.lv||{};
T.open=T.open||{};if(T.quota==null)T.quota=true;T.talkX=T.talkX||{};if(!(T.page>=0&&T.page<NP))T.page=0;
const saveS=()=>saveKey(SKEY,S);
let tSave=null;const saveT=()=>{clearTimeout(tSave);tSave=setTimeout(()=>saveKey("irm-teacher-v1",T),200)};
addEventListener("pagehide",()=>{if(location.hash==="#teacher")saveKey("irm-teacher-v1",T)});
/* 입장 코드별 선생님 기록 (모둠원, 제출, 보너스 점수, 화면별 코드, 설명자 기록) */
function rs(){const k=T.room||"_";T.byRoom=T.byRoom||{};const r=T.byRoom[k]||(T.byRoom[k]={});
  ["score","seeds","said","talkBy","subs","members","claims"].forEach(f=>{if(!r[f]||typeof r[f]!=="object")r[f]={}});if(!Array.isArray(r.seen))r.seen=[];return r}
const isTalk=s=>s.quiz&&(T.talkX[s.id]!=null?!!T.talkX[s.id]:TALK.includes(s.id));

function render(){if(location.hash==="#teacher")return renderTeacher();renderStudent()}
let rT=null;const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,120)};
window.addEventListener("hashchange",()=>{start();render()});

/* ================== 공통: 빈칸 보여 주기 (선생님 화면, 확인 문장, 정답 공개) ================== */
function slotHTML(s,part,mode){mode=mode||{};let i=0;
  return parse(s[part]).map(seg=>{if(!seg.k)return esc(seg.t);const key=`${s.id}-${part}-${i++}`;
    const open=mode.reveal||(mode.open&&mode.open[key]);let o;
    if(open)o=`<mark>${esc(seg.ans[0])}</mark>`;
    else if(seg.k==="ch")o=`<span class="slot c">( ${seg.opts.map(esc).join(" / ")} )</span>`;
    else if(seg.k==="fm")o=`<span class="slot">(${esc(seg.base)})</span>`;
    else o=`<span class="slot">&nbsp;</span>`;
    return mode.click?`<button type="button" class="slotbtn" data-open="${key}" aria-label="이 칸 열기/닫기">${o}</button>`:o}).join("")}
function fixReveal(en,s){const w=esc(s.fix.w[0]);return en.replace(w,`<s>${w}</s> <mark>${esc(s.fix.r[0])}</mark>`)}
function seeCard(s,mode){return `<div class="card see"><div class="no"><span class="lv">${s.stage.n}단계 · ${esc(s.stage.title)}</span><span>${label(s)}</span></div>
  <div class="en">${slotHTML(s,"en",mode)}</div>${s.ex?`<div class="ex">${slotHTML(s,"ex",mode)}</div>`:""}${s.ko?`<div class="ko">${slotHTML(s,"ko",mode)}</div>`:""}</div>`}

/* ================== 학생: 연결 ================== */
let sPeer=null,sConn=null,sOk=false,sEver=false,sLast=0,sRetry=0,sTimer=null,sWhy="",liveState=null,lastSeed=null;
function sSend(m){if(sConn&&sConn.open)try{sConn.send(m)}catch(e){}}
function studentConnect(){clearTimeout(sTimer);if(sPeer){try{sPeer.destroy()}catch(e){}}sPeer=null;sConn=null;sOk=false;
  const p=S.profile;if(!p||!roomOk(p.room||"")||!HAS_PEER)return;
  const peer=new Peer();sPeer=peer;const live=()=>sPeer===peer;
  const to=setTimeout(()=>{if(live()&&!sOk){sWhy=sEver?"":"선생님 방을 찾지 못했어요. 입장 코드를 확인하거나, 선생님 화면이 열려 있는지 확인해 주세요.";sLost()}},12000);
  peer.on("open",()=>{if(!live())return;const c=peer.connect(PREFIX+p.room,{reliable:true});sConn=c;
    c.on("open",()=>{if(live())c.send({t:"join",grp:p.grp,num:p.num,name:p.name||""})});
    c.on("data",d=>{if(!live()||!d)return;sLast=Date.now();
      if(d.t==="state"){clearTimeout(to);if(!sOk){sOk=true;sEver=true;sRetry=0;sWhy="";resendMine()}onState(d.st)}
      else if(d.t==="deny"){toast(d.msg)}
      else if(d.t==="err"){clearTimeout(to);sWhy=d.msg;try{peer.destroy()}catch(e){}sPeer=null;S.profile=null;saveS();render()}});
    c.on("close",()=>{if(live())sLost()});c.on("error",()=>{if(live())sLost()})});
  peer.on("error",e=>{if(!live())return;clearTimeout(to);
    if(e&&e.type==="peer-unavailable"&&!sEver)sWhy="선생님 방을 찾지 못했어요. 입장 코드를 확인하거나, 선생님 화면이 열려 있는지 확인해 주세요.";sLost()});
}
function sLost(){if(sPeer){try{sPeer.destroy()}catch(e){}}sPeer=null;sConn=null;sOk=false;sRetry++;renderSoon();clearTimeout(sTimer);sTimer=setTimeout(studentConnect,Math.min(10000,1500*sRetry))}
/* 몇 초마다 신호를 보내고, 선생님 화면의 대답이 끊기면 다시 연결 */
function sCheck(){if(!S.profile||location.hash==="#teacher")return;if(sOk){if(Date.now()-sLast>15000)sLost();else sSend({t:"ping"})}}
setInterval(sCheck,5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sCheck()});
/* 끊겼다 다시 들어오면 이 화면의 내 제출 기록을 다시 보내기 (선생님 화면이 놓쳤을 수도 있으니) */
function resendMine(){const p=S.profile;if(!p)return;Object.keys(S.res).forEach(seed=>{const r=S.res[seed];if(r&&r.room===p.room&&r.tries)sendSub(seed)})}

    if(mine)S.lv[seed]=mine;else if(!(r&&r.tries))delete S.lv[seed];saveS()}
  if(moved){lastSeed=seed;BAD=new Set();resendMine()}render();if(moved)scrollTo(0,0)}

let CK=null;

function seatsLeft(cur){if(!cur.caps||!S.profile)return null;const p=S.profile,me=mkey(p.grp,p.num),cap=cur.caps["g"+p.grp];if(!cap)return null;
  const used={3:0,2:0,1:0};Object.entries(cur.cl||{}).forEach(([k,v])=>{const m=/^g([0-9]+)n([0-9]+)$/.exec(k);if(m&&+m[1]===p.grp&&k!==me&&used[v]!=null)used[v]++});
  return{3:cap[3]-used[3],2:cap[2]-used[2],1:cap[1]-used[1]}}
function current(){const st=liveState;if(!st||st.page==null||!st.seed||st.page<0||st.page>=NP)return null;
  return{key:st.seed,page:st.page,reveal:!!st.reveal,open:st.open||{},talk:st.talk||null,talkOn:!!st.talkOn,tip:!!st.tip,pick:st.pick||null,cl:st.cl||{},caps:st.caps||null}}
function submit(){const cur=current();if(!cur||cur.reveal)return;const s=first(cur.page);const lv=S.lv[CK];if(!lv){toast("수준을 먼저 고르세요");return}

  const checks=unitsOf(s).map(x=>{const keys=!x.lev||lv!==2?[x.key]:(()=>{const w=x.seg.ans[0].split(" ");if(w.length===1)return [x.key];const g=givenIdx(w);return w.map((_,j)=>x.key+"~"+j).filter((_,j)=>j!==g)})();
    return{keys,ok:()=>x.lev?gradeSeg(x.seg,x.key,lv):x.seg.ans.includes(V(x.key))}});

    if(lv===3)checks.push({keys:[fw],ok:()=>s.fix.w.some(a=>norm(a)===norm(V(fw)))});
    checks.push({keys:[fr],ok:()=>lv===1?s.fix.r.includes(V(fr)):s.fix.r.some(a=>norm(a)===norm(V(fr)))})}

function gradeSeg(seg,key,lv){const V=k=>S.val[CK+"|"+k]||"";const A=seg.ans.map(norm);

/* ================== 선생님: 방 열기 (이 화면이 서버 역할) ================== */
let hPeer=null,hOk=false,hErr="",hTry=0,hTimer=null;const hConns=new Set();

function hostOpen(){if(hPeer||!HAS_PEER)return;clearTimeout(hTimer);if(!T.room){T.room=newRoom();saveT()}
  const code=T.room;const peer=new Peer(PREFIX+code);hPeer=peer;
  peer.on("open",()=>{if(hPeer!==peer)return;hOk=true;hErr="";hTry=0;rs().opened=1;saveT();renderSoon()});
  peer.on("connection",conn=>{conn.on("data",d=>onHostData(conn,d));const drop=()=>{hConns.delete(conn);pushSoon();renderSoon()};conn.on("close",drop);conn.on("error",drop)});
  peer.on("disconnected",()=>{if(hPeer!==peer)return;hOk=false;renderSoon();setTimeout(()=>{if(hPeer===peer&&!peer.destroyed)try{peer.reconnect()}catch(e){}},1000)});
  peer.on("close",()=>{if(hPeer!==peer)return;hPeer=null;hOk=false;renderSoon();hTimer=setTimeout(hostOpen,3000)});
  peer.on("error",e=>{if(hPeer!==peer)return;const t=e&&e.type;
    if(t==="unavailable-id"){try{peer.destroy()}catch(x){}hPeer=null;hOk=false;
      if(!rs().opened){T.room=newRoom();saveT();hostOpen();return}           /* 처음 여는 코드가 이미 쓰이는 중 → 다른 코드로 */
      hTry++;hErr=hTry<=10?"방을 다시 여는 중… (새로고침 직후에는 몇 초 걸려요)":"이 입장 코드를 다시 열지 못했어요. 다른 창에서 선생님 화면이 열려 있지 않은지 확인하거나, '새 입장 코드'를 눌러 주세요.";
      if(hTry<=10)hTimer=setTimeout(hostOpen,3000);renderSoon();return}
    if(t==="browser-incompatible"){hErr="이 브라우저에서는 연결 기능을 쓸 수 없어요. 크롬이나 엣지로 열어 주세요.";renderSoon();return}
    if(peer.destroyed){hPeer=null;hOk=false;hErr="연결 서버에 다시 접속하는 중…";renderSoon();hTimer=setTimeout(hostOpen,3000)}});
}

function pushState(){const m={t:"state",st:stateObj()};hConns.forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})}
function onHostData(conn,d){if(!d||typeof d!=="object")return;
  if(d.t==="ping"){if(conn.open)try{conn.send({t:"pong"})}catch(e){}return}
  if(d.t==="join"){const g=+d.grp,n=+d.num,name=String(d.name||"").slice(0,20);if(!(g>=1&&g<=8&&n>=1&&n<=6))return;const k=mkey(g,n);
    const clash=[...hConns].find(c=>c!==conn&&c.open&&c._k===k&&c._nm!==name);
    if(clash){try{conn.send({t:"err",msg:`${g}모둠 ${n}번은 이미 ${clash._nm||"다른 친구"}이(가) 쓰고 있어요. 번호를 확인해 주세요.`})}catch(e){}setTimeout(()=>{try{conn.close()}catch(e){}},500);return}
    [...hConns].forEach(c=>{if(c!==conn&&c._k===k){hConns.delete(c);try{c.close()}catch(e){}}}); /* 같은 학생이 다시 들어옴 → 예전 연결 정리 */
    conn._k=k;conn._nm=name;conn._g=g;conn._n=n;hConns.add(conn);rs().members[k]={grp:g,num:n,name};saveT();
    try{conn.send({t:"state",st:stateObj()})}catch(e){}pushSoon();renderSoon();return}
  if(d.t==="claim"&&conn._k){const lv=+d.lv,k=conn._k,g=conn._g,seed=T.code;const deny=msg=>{try{conn.send({t:"deny",msg});conn.send({t:"state",st:stateObj()})}catch(e){}};
    if(!PTS[lv]||d.seed!==seed||PAGES[T.page].see)return deny("화면이 바뀌었어요. 다시 골라 주세요.");
    if(T.reveal)return deny("정답이 공개된 뒤에는 고를 수 없어요.");
    const cl=(rs().claims[seed]=rs().claims[seed]||{});if(cl[k]===lv){try{conn.send({t:"state",st:stateObj()})}catch(e){}return}
    if((rs().subs[seed]||{})[k])return deny("첫 제출 뒤에는 수준을 바꿀 수 없어요.");
    if(T.quota){const used=Object.entries(cl).filter(([kk,v])=>kk!==k&&v===lv&&kk.startsWith("g"+g+"n")).length;
      if(used>=capsOf(g)[lv])return deny(`${LV[lv].n} 자리가 다 찼어요. 다른 수준을 골라 주세요.`)}
    cl[k]=lv;saveT();pushState();renderSoon();return}
  if(d.t==="sub"&&conn._k&&d.rec&&typeof d.seed==="string"&&Object.values(rs().seeds).includes(d.seed)){const r=d.rec;const lv=+((rs().claims[d.seed]||{})[conn._k]||r.lv);if(!PTS[lv])return;
    const rec={grp:conn._g,num:conn._n,lv,tries:Math.min(2,+r.tries||1),done:r.done?1:0,ok:r.ok?1:0,pts:0};
    if(rec.ok)rec.pts=PTS[lv][rec.tries-1]||0;  /* 점수는 선생님 화면이 다시 계산 */
    const sub=rs().subs;(sub[d.seed]=sub[d.seed]||{})[conn._k]=rec;saveT();renderSoon()}
}
const onlineKeys=()=>new Set([...hConns].filter(c=>c.open&&c._k).map(c=>c._k));
const membersOf=g=>Object.values(rs().members).filter(m=>m&&+m.grp===g);
/* 설명자 뽑기: 지금 접속한 모둠원 중에서 돌아가며 (모두 한 번씩 하기 전에는 다시 안 뽑힘) */
function pickTalk(again){const pg=T.page,r=rs(),prev=r.talkBy[pg]||{},out={},on=onlineKeys();
  for(let g=1;g<=T.groups;g++){let mem=membersOf(g).filter(m=>on.has(mkey(m.grp,m.num))).map(m=>+m.num);if(!mem.length)mem=membersOf(g).map(m=>+m.num);if(!mem.length)continue;
    const old=again&&prev["g"+g]?+prev["g"+g].n:null;let said=(r.said[g]||[]).filter(n=>n!==old);
    let pool=mem.filter(n=>!said.includes(n)&&n!==old);
    if(!pool.length){said=[];pool=mem.filter(n=>n!==old);if(!pool.length)pool=mem}
    const n=pool[Math.floor(Math.random()*pool.length)];said.push(n);r.said[g]=said;
    const m=r.members[mkey(g,n)];out["g"+g]={n,nm:(m&&m.name)||""}}
  r.talkBy[pg]=out}
function qrSVG(text,cell){if(typeof qrcode!=="function")return "";try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:cell,margin:2,scalable:true})}catch(e){return ""}}

/* ================== 선생님 화면 (#teacher) ================== */
let qrBig=false;
function renderTeacher(){$("#app").className="wrap wide";
  if(!T.code){T.code=seedOf(T.page);saveT()}
  const pg=PAGES[T.page],s=first(T.page),talk=isTalk(s);setStage(s);
  const groups=Array.from({length:T.groups},(_,i)=>i+1);const on=onlineKeys();const R=rs();
  /* 모둠 점수 = 모둠원 점수 합 ÷ 모둠원 수 + 선생님 보너스 */
  const sum={},who={};Object.values(R.subs).forEach(bySeed=>{if(bySeed&&typeof bySeed==="object")Object.values(bySeed).forEach(x=>{if(!x||x.grp==null)return;const g=+x.grp;sum[g]=(sum[g]||0)+(+x.pts||0);(who[g]=who[g]||new Set()).add(+x.num)})});
  const total=g=>{const n=Math.max(1,membersOf(g).length,who[g]?who[g].size:0);return Math.max(0,Math.round(((sum[g]||0)/n+(R.score[g]||0))*10)/10)};
  const max=Math.max(1,...groups.map(total));
  const now=R.subs[T.code]||{};const subsOf=g=>Object.values(now).filter(x=>x&&+x.grp===g);
  const onIn=g=>membersOf(g).filter(m=>on.has(mkey(m.grp,m.num))).length;
  const cl=R.claims[T.code]||{};
  const status=g=>{const o=onIn(g);if(pg.see)return `${o}명 접속`;const sb=subsOf(g);
    const lvc=[3,2,1].map(l=>{const c=Object.entries(cl).filter(([k,v])=>v===l&&k.startsWith("g"+g+"n")).length;return c?LV[l].n+c:""}).filter(Boolean).join(" ");
    return `${sb.filter(x=>x.done).length}/${o}명 완료 · ✅${sb.filter(x=>x.ok).length}${lvc?" · "+lvc:""}`};
  const doneAll=groups.reduce((a,g)=>a+subsOf(g).filter(x=>x.done).length,0),onAll=on.size;
  const url=T.room?joinURL(T.room):"";const fileMode=location.protocol==="file:";
  const navBtns=`<button class="btn small" id="t-prev" ${T.page===0?"disabled":""}>← 이전</button><button class="btn small" id="t-next" ${T.page===NP-1?"disabled":""}>다음 →</button>`;
  const connLine=!HAS_PEER?"연결 도구를 불러오지 못했어요 (인터넷 확인 후 새로고침)":hOk?`입장 코드 · ● 열림 · ${onAll}명 접속`:(hErr||"방을 여는 중…");
  const top=`<div class="bigcode"><div class="row" style="gap:14px"><button type="button" class="qrmini" id="t-qr" aria-label="QR 크게 보기">${qrSVG(url,3)}</button>
      <div><div style="font-size:.85rem;opacity:.9">${esc(connLine)}</div><b>${esc(T.room||"—")}</b></div></div>
      <div class="row">${pg.see?`<span>👀 확인 문장</span>`:`<span>${doneAll}/${onAll}명 완료</span>`}${navBtns}</div></div>
      ${fileMode?`<div class="conn">지금은 컴퓨터 안의 파일로 열려 있어서 학생들이 QR로 들어올 수 없어요. 인터넷 주소(예: Vercel)로 열어 주세요.</div>`:""}`;
  let main;
  if(pg.see){
    main=`<div class="note">👀 확인 문장 · 빈칸을 누르면 그 칸만 열려요 (학생 화면에도 같이 열려요).</div>
      ${pg.items.map(i=>seeCard(ITEMS[i],{reveal:T.reveal,open:T.open,click:!T.reveal})).join("")}
      <div class="row"><button class="btn" id="t-rev">${T.reveal?"모두 숨기기":"전체 공개"}</button>${Object.keys(T.open).length&&!T.reveal?'<button class="btn ghost small" id="t-close">연 칸 모두 닫기</button>':""}</div>`}
  else{
    let en=slotHTML(s,"en",{reveal:T.reveal});if(s.fix&&T.reveal)en=fixReveal(en,s);
    const tipOn=T.reveal&&s.tip&&(T.tip||!talk);
    const tb=R.talkBy[T.page]||{};
    const talkPanel=T.reveal&&talk?`<div class="panel stack"><h3>🎤 모둠별 설명 담당</h3>
      <div class="talklist">${groups.map(g=>{const t=tb["g"+g];return `<div><b>${g}모둠</b> ${t?`${t.n}번 ${esc(t.nm||"")}`:'<span class="note">접속한 학생 없음</span>'}</div>`}).join("")}</div>
      <div class="row"><button class="btn small" id="t-tip">${T.tip?"해설 숨기기":"해설 보기"}</button><button class="btn ghost small" id="t-retalk">설명자 다시 뽑기</button><button class="btn ghost small" id="t-pick">발표 모둠 뽑기</button>${T.pick?`<b>📢 ${T.pick}모둠 발표</b>`:""}</div></div>`:"";
    main=`<div class="card">
      <div class="no"><span class="lv">${s.stage.n}단계 · ${esc(s.stage.title)}</span><span>${label(s)}</span>${s.star?'<span class="star">★ 핵심 문장</span>':""}<span>📝 각자 상·중·하로 풀기</span></div>
      <div class="en">${en}</div>
      ${s.fix&&!T.reveal?`<div class="note">틀린 곳 한 곳을 찾아 고치세요.</div>`:""}
      ${s.ex?`<div class="ex">${slotHTML(s,"ex",{reveal:T.reveal})}</div>`:""}
      ${s.ko?`<div class="ko">${slotHTML(s,"ko",{reveal:T.reveal})}</div>`:""}
      ${tipOn?`<div class="hint">${esc(s.tip)}</div>`:""}
      <div class="row"><button class="btn" id="t-rev">${T.reveal?"정답 숨기기":"정답 공개"}</button><button class="btn ghost small" id="t-talk" aria-pressed="${talk}">🎤 설명 문장: ${talk?"켜짐":"꺼짐"}</button></div>
    </div>${talkPanel}`}
  const nav=STAGES.map(sg=>`<span class="sep">${sg.n}단계 ${esc(sg.title)}</span>`+PAGES.map((p,i)=>{const f=first(i);if(f.stage!==sg)return "";const l=ITEMS[p.items[p.items.length-1]];
      const lab=p.see&&p.items.length>1?`${f.id}–${l.id}`:`${f.id}`;
      return `<button data-go="${i}" class="${i===T.page?"cur":""} ${R.seen.includes(i)?"seen":""} ${p.see?"see":""} ${!p.see&&isTalk(f)?"talk":""}" aria-label="${p.see?"확인 문장":"문제 문장"} ${lab}">${lab}</button>`}).join("")).join("");
  $("#app").innerHTML=`<div class="top"><h1>관용구 리딩 미션 · 선생님 화면</h1>
   <div class="row"><label class="f" style="flex:0 0 auto;flex-direction:row;align-items:center;gap:6px">모둠 수 <select id="t-g" style="width:auto">${[4,5,6,7,8].map(n=>`<option ${n===T.groups?"selected":""}>${n}</option>`).join("")}</select></label></div></div>
  <div class="tgrid">
   <div class="stack proj">
    ${top}
    ${main}
    <div class="panel stack"><div class="nav">${nav}</div><div class="note">실선 = 📝 문제 문장 · 점선 = 👀 확인 문장 · 🎤 = 설명 문장</div></div>
   </div>
   <div class="stack">
    <div class="panel stack"><h3>모둠 점수 <span class="note">(모둠원 평균 + 보너스)</span></h3>
     <div class="score">${groups.map(g=>{const v=total(g);return `<div class="sc ${v===max&&v>0?"lead":""}"><span class="g">${g}모둠</span>
       <span class="note">${status(g)}</span>
       <span class="pts">${v}</span>
       <span class="bs" style="grid-column:1/-1"><span class="note" style="margin-right:auto">보너스</span><button data-sc="${g}" data-d="1">+1</button><button data-sc="${g}" data-d="-1" aria-label="${g}모둠 1점 빼기">−1</button></span>
       <span class="bar" style="grid-column:1/-1"><i style="width:${v/max*100}%"></i></span></div>`}).join("")}</div>
     <button class="btn ghost small" id="t-quota" aria-pressed="${!!T.quota}">모둠 안 수준 나누기: ${T.quota?"켜짐":"꺼짐"}</button>
     <span class="note">${T.quota?"3명 상1·중1·하1 / 4명 상1·중2·하1 / 5명 상1·중2·하2 (지금 접속한 인원 기준)":"꺼짐: 자리 수 제한 없이 각자 상·중·하 중 하나를 골라요"}</span>
     <span id="t-rs"><button class="btn ghost small" id="t-reset">새 수업 시작 (기록·점수 지우기)</button></span>
     <span id="t-nr"><button class="btn ghost small" id="t-newroom">새 입장 코드 (다른 반)</button></span>
    </div>
    <div class="panel note">학생 화면은 선생님이 <b>다음 →</b>을 눌러야 함께 넘어가요. <b>수업 중에는 이 화면을 닫지 마세요</b> (새로고침은 괜찮아요).<br>📝 문제: 각자 상·중·하로 풀기 → 완료 인원 확인 → 정답 공개 (🎤 문장은 모둠별 설명자가 자동으로 뽑혀요) → 모둠 안 설명 → 해설 보기<br>👀 확인: 빈칸을 눌러 하나씩 열거나 전체 공개 → 학습지 빨간 펜 수정<br>점수: 상 3·2점, 중 2·1점, 하 1·1점 (한 번에·두 번째)</div>
   </div>
  </div>
  ${qrBig?`<div class="overlay" id="t-ov"><div class="qrbig">${qrSVG(url,10)}<b>${esc(T.room||"")}</b><span>${esc(url)}</span><button class="btn" id="t-ovx">닫기</button></div></div>`:""}`;
  const go=i=>{T.page=i;T.code=seedOf(i);T.reveal=false;T.open={};T.tip=false;T.pick=null;if(!rs().seen.includes(i))rs().seen.push(i);saveT();pushState();render();scrollTo(0,0)};
  $("#t-prev").onclick=()=>go(T.page-1);$("#t-next").onclick=()=>go(T.page+1);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const upd=()=>{saveT();pushState();render()};
  $("#t-rev").onclick=()=>{T.reveal=!T.reveal;if(pg.see)T.open={};else if(T.reveal&&talk&&!rs().talkBy[T.page])pickTalk(false);upd()};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const k=b.dataset.open;if(T.open[k])delete T.open[k];else T.open[k]=1;upd()});
  const tc=$("#t-close");if(tc)tc.onclick=()=>{T.open={};upd()};
  const tt=$("#t-talk");if(tt)tt.onclick=()=>{T.talkX[s.id]=!talk;if(!talk&&T.reveal&&!rs().talkBy[T.page])pickTalk(false);upd()};
  const tp=$("#t-tip");if(tp)tp.onclick=()=>{T.tip=!T.tip;upd()};
  const rt=$("#t-retalk");if(rt)rt.onclick=()=>{pickTalk(true);upd();toast("설명자를 다시 뽑았어요")};
  const pk=$("#t-pick");if(pk)pk.onclick=()=>{let c=groups.filter(g=>onIn(g)>0);if(!c.length)c=groups.slice();if(c.length>1)c=c.filter(g=>g!==+T.pick);T.pick=c[Math.floor(Math.random()*c.length)];upd()};
  $("#t-qr").onclick=()=>{qrBig=true;render()};
  const ov=$("#t-ovx");if(ov){ov.onclick=()=>{qrBig=false;render()};$("#t-ov").onclick=e=>{if(e.target.id==="t-ov"){qrBig=false;render()}}}
  $("#t-quota").onclick=()=>{T.quota=!T.quota;upd()};
  $("#t-g").onchange=e=>{T.groups=+e.target.value;saveT();render()};
  document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const g=b.dataset.sc;rs().score[g]=(rs().score[g]||0)+ +b.dataset.d;saveT();render()});
  $("#t-reset").onclick=()=>{$("#t-rs").innerHTML=`<span class="confirm">제출 기록과 점수를 모두 지울까요? <button class="btn small" id="ry">지우기</button><button class="btn ghost small" id="rn">취소</button></span>`;
    $("#ry").onclick=()=>{const r=rs();r.score={};r.seen=[T.page];r.seeds={};r.said={};r.talkBy={};r.subs={};r.members={};r.claims={};
      hConns.forEach(c=>{if(c.open&&c._k)r.members[c._k]={grp:c._g,num:c._n,name:c._nm}}); /* 지금 접속한 학생은 그대로 */
      T.reveal=false;T.open={};T.tip=false;T.pick=null;T.code=seedOf(T.page);saveT();pushState();render()};$("#rn").onclick=render};
  $("#t-newroom").onclick=()=>{$("#t-nr").innerHTML=`<span class="confirm">새 코드로 바꾸면 지금 학생들은 새 코드로 다시 들어와야 해요. 바꿀까요? <button class="btn small" id="ny">바꾸기</button><button class="btn ghost small" id="nn">취소</button></span>`;
    $("#ny").onclick=()=>{hostClose();T.room=newRoom();T.page=0;T.reveal=false;T.open={};T.tip=false;T.pick=null;T.code=seedOf(0);if(!rs().seen.includes(0))rs().seen.push(0);saveT();hErr="";hTry=0;hostOpen();render()};$("#nn").onclick=render};
}

/* ================== 시작 ================== */
function start(){if(location.hash==="#teacher"){if(sPeer){try{sPeer.destroy()}catch(e){}sPeer=null}hostOpen();if(!rs().seen.includes(T.page))rs().seen.push(T.page)}
  else{hostClose();if(S.profile&&roomOk(S.profile.room||"")&&!sPeer&&!sOk)studentConnect()}}
start();
render();
</script>
