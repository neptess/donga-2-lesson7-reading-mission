<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>관용구 리딩 미션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one sentence at a time. Student tablet = narrow card; teacher projector = wide sentence + code + scoreboard. Stage colors: curtain red, bean green, rain blue. */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#dde2de;
  --s1:#b23a2e; --s2:#3d7a37; --s3:#2c6aa3; --gold:#c98a12;
  --ok:#23824a; --okbg:#e5f4ea; --bad:#c2362b; --badbg:#fbe9e7; --hl:#fff3c4;
  --f-display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --stage:var(--s1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141816; --card:#1d2220; --ink:#e9ede9; --muted:#9aa5a0; --line:#323a36;
  --s1:#e2695c; --s2:#74b56b; --s3:#62a2dd; --gold:#e3aa3c;
  --ok:#5fc585; --okbg:#173325; --bad:#ef7468; --badbg:#3a1d1a; --hl:#4a3f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141816; --card:#1d2220; --ink:#e9ede9; --muted:#9aa5a0; --line:#323a36;
  --s1:#e2695c; --s2:#74b56b; --s3:#62a2dd; --gold:#e3aa3c;
  --ok:#5fc585; --okbg:#173325; --bad:#ef7468; --badbg:#3a1d1a; --hl:#4a3f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1280px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.8rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.who{font-size:.85rem;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--stage);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0;flex:1 1 120px}
select,input.t{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.note{font-size:.85rem;color:var(--muted)}
.lv{color:var(--stage);font-weight:600;font-size:.8rem;letter-spacing:.08em}
/* code entry */
.codebox{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.codebox input{font-family:var(--f-en);font-size:2rem;letter-spacing:.4em;text-align:center;width:9ch;padding:6px 4px 6px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.codebox .btn{font-size:1.05rem}
/* sentence card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.no{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.star{color:var(--gold);font-weight:700}
.en{font-family:var(--f-en);font-size:1.15rem;line-height:2.1}
.ko{color:var(--muted);line-height:2}
.ex{font-size:.95rem;line-height:2;padding:6px 10px;background:var(--paper);border-radius:8px}
input.blank{font-family:var(--f-en);font-size:1rem;border:0;border-bottom:2px solid var(--stage);background:transparent;color:var(--ink);padding:0 4px;text-align:center;min-width:3.5em;border-radius:0}
input.blank:disabled{border-bottom-style:dashed;opacity:.8}
.ko input.blank,.ex input.blank{font-family:var(--f-body)}
.form em{font-style:normal;font-size:.85em;color:var(--stage);margin-right:2px}
.choice{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:0 9px;line-height:1.9;font-size:.95em}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--stage);background:var(--stage);color:#fff}
.good{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ink)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important;color:var(--ink)!important}
.fixrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.fixrow input{max-width:150px}
.role{border-radius:12px;padding:14px 16px;font-weight:600;font-size:1.05rem}
.role.me{background:var(--stage);color:#fff}
.role.other{background:var(--paper);border:1px dashed var(--line)}
.result{text-align:center;border-radius:16px;padding:22px 12px;font-family:var(--f-display);font-size:3rem;line-height:1.1}
.result small{display:block;font-family:var(--f-body);font-size:1rem;margin-top:6px}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.no{background:var(--badbg);color:var(--bad)}
mark{background:var(--hl);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:700}
.hint{font-size:.95rem;background:var(--hl);border-radius:8px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
/* teacher */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.proj .en{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.9}
.proj .ko{font-size:clamp(1rem,1.6vw,1.3rem)}
.slot{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--stage);text-align:center;color:var(--stage);font-weight:700}
.slot.c{border:0;min-width:0;font-weight:400;color:var(--ink)}
.bigcode{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--stage);color:#fff;border-radius:14px;padding:12px 18px}
.bigcode b{font-family:var(--f-en);font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:.25em;font-variant-numeric:tabular-nums}
.bigcode .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{min-width:34px;padding:3px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:.8rem;font-variant-numeric:tabular-nums}
.nav button.cur{background:var(--stage);border-color:var(--stage);color:#fff}
.nav button.seen{border-color:var(--stage)}
.nav .sep{width:100%;font-size:.75rem;color:var(--muted);margin-top:4px}
.score{display:flex;flex-direction:column;gap:6px}
.sc{display:grid;grid-template-columns:4.5em 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.sc .g{font-weight:600}
.sc .pts{font-family:var(--f-en);font-weight:700;font-size:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.sc .bs{display:flex;gap:4px}
.sc .bs button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:.85rem}
.sc.lead{border-color:var(--gold)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--stage)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"><p class="note">불러오는 중…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================== 학습지 데이터 ==================
   [[a|b]] 빈칸 입력 (정답 여러 개는 |)
   {{x/y/z=y}} 고르기 (정답 여러 개는 =y|z)
   <<base=a|b>> 형태 고쳐 쓰기
   fix: 틀린 곳 고치기 */
const STAGES=[
{n:1,title:"Break a Leg",ko:"다리 부러지세요",c:"--s1",
 sents:[
 {id:1,en:"Break a Leg",ko:"다리 {{부러지세요/조심하세요/펴세요=부러지세요}}"},
 {id:2,en:"It was the day of the school play.",ko:"학교 {{연극/놀이/운동회=연극}}의 날이었다.",tip:"play: (명사) 연극"},
 {id:3,en:"Lilly practiced for the play [[for]] weeks.",ko:"Lilly는 연습했다/ 그 연극을 위해/ 몇 주 동안.",tip:"for + 기간: ~ 동안"},
 {id:4,star:1,en:"The curtains [[were about to]] go up, and she felt very nervous.",ko:"커튼이 막 {{올라가려던/내려오려던/찢어지려던=올라가려던}} 참에, 그녀는 매우 긴장했다.",tip:"be about to + 동사원형 = 막 ~하려던 참이다. 주어 The curtains(복수) + 과거 → were about to"},
 {id:5,en:"Her friend smiled and said, \"[[Break]] a leg!\"",ko:"그녀의 친구가 웃으며 말했다, \"다리 부러져라!\""},
 {id:6,en:"Lilly said, \"Thanks. [[I will|I'll]]!\"",ko:"Lilly는 \"고마워. {{그럴게/싫어/미안해=그럴게}}!\"라고 말했다."},
 {id:7,en:"She [[went on|got on]] the stage and performed {{successful/successfully=successfully}}.",ko:"그녀는 무대에 올라갔고 {{성공적으로/실패하며/조용히=성공적으로}} 공연했다.",tip:"동사 performed를 꾸미는 말 → 부사 successfully"},
 {id:8,star:1,en:"[[Although|Though|Even though]] \"Break a leg\" may sound [[like]] a bad thing, it actually means \"Good luck!\"",ko:"비록 '다리 부러지세요'가 나쁜 것처럼 들릴지라도, 그것은 사실 \"{{행운을 빌어/조심해/잘 가=행운을 빌어}}!\"를 의미한다.",tip:"although: 비록 ~일지라도 / sound like + 명사: ~처럼 들리다"},
 {id:9,star:1,en:"German actors {{who/which/that=who|that}} came to the United States in the early 20th century first used this phrase.",ex:"이 문장의 본동사(한 단어): [[used]]",ko:"독일 배우들이/ 20세기 초에 미국에 온/ 처음 사용했다/ 이 {{표현/연극/무대=표현}}을.",tip:"선행사 German actors(사람) → 주격 관계대명사 who/that. 관계사절(who ~ century) 뒤의 used가 본동사"},
 {id:10,en:"By <<wish=wishing>> each other bad luck, they believed that it would go away.",ko:"서로에게 {{불운/행운/칭찬=불운}}을 빌어줌으로써, 그들은 불운이 {{사라질/커질/돌아올=사라질}} 거라고 믿었다.",tip:"전치사(By) 뒤 → 동명사(-ing)"},
 {id:11,en:"This expression [[is]] still [[used]] today.",ko:"이 {{표현/연극/공연=표현}}은 오늘날에도 여전히 사용된다.",tip:"표현이 '사용되는' 것 → 수동태 be + p.p."},
 {id:12,star:1,en:"\"Break a leg\" is a phrase {{whom/which/that=which|that}} people say to wish performers good luck before a show.",ex:"to wish → {{명사적/형용사적/부사적=부사적}} 용법 (~하기 위해, 목적)",ko:"'다리 부러지세요'는 어구이다/ 사람들이 말하는/ 공연자들에게 {{행운/불운/박수=행운}}을 빌기 위해/ 공연 전에.",tip:"선행사 a phrase(사물) → 목적격 관계대명사 which/that (whom은 사람). to wish는 '~하기 위해'(목적)"},
 {id:"Q1",en:"How did Lilly feel when the curtains were about to go up? {{She felt very nervous./She felt very happy./She felt bored.=She felt very nervous.}}"},
 {id:"Q2",en:"Lilly couldn't get on the stage because her leg was broken. {{T/F=F}}"},
 {id:"Q3",en:"\"Break a leg\" is a phrase that people say to wish performers bad luck. {{T/F=F}}"}
 ]},
{n:2,title:"Spill the Beans",ko:"콩을 쏟다",c:"--s2",
 sents:[
 {id:13,en:"Spill the Beans",ko:"콩을 {{쏟다/심다/먹다=쏟다}}"},
 {id:14,en:"Tommy and Lisa <<prepare=were preparing|prepared>> a surprise party for Hana.",ko:"Tommy와 Lisa는 준비하고 있었다/ {{깜짝/생일/졸업=깜짝}} 파티를/ 하나를 위해.",tip:"'준비하고 있었다' → 과거진행형 were + -ing"},
 {id:15,star:1,en:"But Tommy was not [[good at keeping]] secrets.",ko:"그러나 Tommy는 비밀을 {{지키는/말하는/만드는=지키는}} 것을 잘하지 못했다.",tip:"be good at -ing: ~을 잘하다. 전치사 at 뒤 → 동명사 keeping"},
 {id:16,en:"So, Lisa told him, \"Don't spill the beans.\"",ko:"그래서, Lisa는 그에게 \"{{비밀을 누설하지 마/콩을 먹지 마/늦지 마=비밀을 누설하지 마}}\"라고 말했다."},
 {id:17,star:1,en:"Tommy said, \"Don't worry. I promise to not tell Hana.\"",fix:{w:["to not"],r:["not to"]},ko:"Tommy는 \"걱정 마. 하나에게 말하지 않겠다고 약속해\"라고 말했다.",tip:"to부정사의 부정: not to + 동사원형 (to not ✗)"},
 {id:18,en:"Tommy [[kept]] his promise and the surprise party was a big success.",ko:"Tommy는 그의 약속을 지켰고 깜짝 파티는 크게 {{성공/실패/취소=성공}}했다.",tip:"keep a promise: 약속을 지키다 (과거형 kept)"},
 {id:19,star:1,en:"Hana was {{complete/completely=completely}} {{surprising/surprised=surprised}}.",ko:"하나는 완전히 깜짝 놀랐다.",tip:"형용사를 꾸미는 말 → 부사 completely / 감정을 느끼는 사람 → -ed (surprised)"},
 {id:20,en:"What does the phrase \"[[spill]] the beans\" means?",fix:{w:["means"],r:["mean"]},ko:"이 어구 '콩을 쏟다'가 무엇을 의미하니?",tip:"does가 있는 의문문 → 동사원형 mean"},
 {id:21,en:"It means [[to reveal]] a secret.",ko:"그것은 비밀을 {{드러내는/지키는/숨기는=드러내는}} 것을 의미한다."},
 {id:22,en:"Where does this phrase {{come/comes=come}} [[from]]?",ko:"이 어구는 어디에서 유래한 건가?",tip:"come from: ~에서 유래하다. does 의문문 → 동사원형"},
 {id:23,en:"It comes from an [[ancient]] Greek way of voting.",ko:"이것은 유래한 것이다/ 고대 그리스의 {{투표/요리/전쟁=투표}} 방법에서."},
 {id:24,en:"[[When]] Greeks voted, they put a white or black bean in a big jar.",ko:"그리스인들이 {{투표할/요리할/여행할=투표할}} 때, 그들은 넣었다/ 흰색이나 검은색 콩을/ 큰 {{항아리/상자/주머니=항아리}}에."},
 {id:25,star:1,en:"[[When|After|Once]] the voting was completed, the beans <<spill=were spilled out|were spilled>> to reveal the results.",ko:"투표가 {{완료/시작/취소=완료}}되었을 때, 그 콩들은 쏟아졌다/ 결과를 {{드러내기 위해/숨기기 위해/세기 위해=드러내기 위해}}.",tip:"콩이 '쏟아지는' 것 → 수동태 were spilled (out). to reveal: ~하기 위해"},
 {id:26,en:"From then, people began <<use=to use|using>> this phrase with a new meaning.",ko:"{{그때부터/옛날에/지금도=그때부터}}, 사람들은 사용하기 시작했다/ 이 어구를/ 새로운 {{의미/규칙/소리=의미}}로.",tip:"begin + to부정사 / 동명사 모두 가능"},
 {id:"Q4",en:"The phrase \"spill the beans\" means to {{reveal/keep=reveal}} a secret."}
 ]},
{n:3,title:"Take a Rain Check",ko:"우천 교환권을 받다",c:"--s3",
 sents:[
 {id:27,en:"Take a Rain Check",ko:"{{우천 교환권/우산/일기 예보=우천 교환권}}을 받다"},
 {id:28,en:"Sarah wanted [[to see]] a movie with her best friend, Emily.",ko:"Sarah는 그녀의 가장 친한 친구 Emily와 영화를 보기를 원했다.",tip:"want + to부정사"},
 {id:29,en:"So, she asked Emily, \"[[Do you want to]] see a movie with me today?\"",ko:"그래서 그녀는 Emily에게 물었다, \"오늘 나랑 영화 보러 갈래?\""},
 {id:30,en:"Emily replied, \"I'm sorry, but I [[have to|will have to]] take a rain check. I [[have to|need to]] go to my grandmother's house today.\"",ko:"Emily는 {{대답/질문/거절=대답}}했다, \"미안하지만, 우천 교환권을 받아야만 해. 나는 오늘 할머니 댁에 가야 해.\"",tip:"have to + 동사원형: ~해야 한다"},
 {id:31,en:"\"That's okay. Let's do it another time,\" said Sarah.",ko:"\"괜찮아. {{다음에 하자/지금 하자/하지 말자=다음에 하자}}\"라고 Sarah가 말했다."},
 {id:32,star:1,en:"{{That/Although=Although}} Sarah was a little {{disappointed/disappointing=disappointed}}, she understood Emily's situation.",ko:"{{비록/왜냐하면/그래서=비록}} Sarah는 조금 실망했지만, 그녀는 Emily의 {{상황/기분/할머니=상황}}을 이해했다.",tip:"although: 비록 ~이지만 / 감정을 느끼는 사람 → -ed (disappointed)"},

const TOK=/\[\[(.+?)\]\]|\{\{(.+?)\}\}|<<(.+?)>>/g;
function parse(tpl){const out=[];let last=0,m;TOK.lastIndex=0;
  while((m=TOK.exec(tpl))){if(m.index>last)out.push({t:tpl.slice(last,m.index)});
    if(m[1])out.push({k:"in",ans:m[1].split("|")});
    else if(m[2]){const i=m[2].lastIndexOf("=");out.push({k:"ch",opts:m[2].slice(0,i).split("/"),ans:m[2].slice(i+1).split("|")})}
    else{const i=m[3].indexOf("=");out.push({k:"fm",base:m[3].slice(0,i),ans:m[3].slice(i+1).split("|")})}
    last=TOK.lastIndex}
  if(last<tpl.length)out.push({t:tpl.slice(last)});return out}
function itemsOf(s){const items=[];["en","ex","ko"].forEach(p=>{if(!s[p])return;let i=0;parse(s[p]).forEach(seg=>{if(seg.k){seg.key=`${s.id}-${p}-${i++}`;items.push(seg)}})});
  if(s.fix){items.push({k:"fx",key:s.id+"-fw",ans:s.fix.w});items.push({k:"fx",key:s.id+"-fr",ans:s.fix.r})}return items}

/* 해시: 같은 코드면 모든 기기가 같은 결과를 계산 (연결 불필요) */
function h(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
const itemOfCode=code=>h("k"+code)%N;

   아래 따옴표 안에 Firebase 데이터베이스 주소를 넣으면 실시간 모드가 켜집니다.

async function fput(path,v){try{const r=await fetch(`${FB}/${path}.json`,{method:"PUT",body:JSON.stringify(v)});return r.ok}catch(e){return false}}
async function fdel(path){try{await fetch(`${FB}/${path}.json`,{method:"DELETE"})}catch(e){}}
function fwatch(path,cb){let tree=null;const es=new EventSource(`${FB}/${path}.json`);
  const setAt=(p,d,patch)=>{const parts=p.split("/").filter(Boolean);
    if(!parts.length){if(patch&&tree&&typeof tree==="object"){for(const k in d){if(d[k]===null)delete tree[k];else tree[k]=d[k]}}else tree=d;return}
    if(!tree||typeof tree!=="object")tree={};let o=tree;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!=="object")o[parts[i]]={};o=o[parts[i]]}
    const k=parts[parts.length-1];
    if(patch){const t=o[k]&&typeof o[k]==="object"?o[k]:{};for(const j in d){if(d[j]===null)delete t[j];else t[j]=d[j]}o[k]=t}
    else if(d===null)delete o[k];else o[k]=d};
  const on=patch=>e=>{try{const m=JSON.parse(e.data);setAt(m.path,m.data,patch);cb(tree,true)}catch(x){}};
  es.addEventListener("put",on(false));es.addEventListener("patch",on(true));es.onerror=()=>cb(tree,false);return es}

function tpl(s,part,me,r){const locked=!me||(r&&r.done);let i=0;
  return parse(s[part]).map(seg=>{if(!seg.k)return esc(seg.t);const key=`${s.id}-${part}-${i++}`;const v=S.val[CK+"|"+key]||"";
    const mark=r&&r.done?(r.ok?"good":""):"";
    if(seg.k==="ch")return `<span class="choice">${seg.opts.map(o=>`<button type="button" class="opt ${v===o?"sel":""}" data-key="${key}" data-v="${esc(o)}" ${locked?"disabled":""}>${esc(o)}</button>`).join("")}</span>`;
    const w=Math.max(4,Math.max(...seg.ans.map(a=>a.length))+1);
    const inp=`<input class="blank ${mark}" id="i-${key}" data-key="${key}" size="${w}" value="${esc(locked&&!me?"":v)}" autocomplete="off" autocapitalize="off" spellcheck="false" ${locked?"disabled":""} aria-label="빈칸">`;
    return seg.k==="fm"?`<span class="form"><em>(${esc(seg.base)})</em>${inp}</span>`:inp}).join("")}

function resultHTML(s,r){
  const g=S.profile.grp;
  if(r&&r.done)return r.ok?`<div class="result ok"><small style="font-size:1.6rem;margin:0 0 6px">${g}모둠</small>✅ +${r.pts}<small>${r.tries===1?"한 번에 정답!":"두 번째에 정답!"} ${LIVE?"선생님 화면에 반영됐어요.":"화면을 들어 선생님께 보여 주세요."}</small></div>`
    :`<div class="result no"><small style="font-size:1.6rem;margin:0 0 6px">${g}모둠</small>❌ 0점<small>두 번 모두 틀렸어요. 선생님의 정답 공개를 기다려요.</small></div>`;

function startTeacherLive(){if(!LIVE||!T.room||tRoomOn===T.room)return;if(tES){tES.close();tES=null}tRoomOn=T.room;tSubs={};tMembers={};
  let t=null;tES=fwatch(`rooms/${T.room}`,(tree,ok)=>{tOk=ok;tSubs=(tree&&tree.subs)||{};tMembers=(tree&&tree.members)||{};clearTimeout(t);t=setTimeout(()=>{if(location.hash==="#teacher")renderTeacher()},150)});pushState()}
function pushState(){if(LIVE&&T.room)fput(`rooms/${T.room}/state`,{idx:T.idx,seed:T.code,reveal:!!T.reveal,t:Date.now()})}
function renderTeacher(){$("#app").className="wrap wide";
  if(LIVE){if(!T.code||/^\d{3}$/.test(T.code)){T.code=rid();saveT()}}
  else if(T.code==null||itemOfCode(T.code)!==T.idx){T.code=newCode(T.idx);saveT()}
  if(LIVE&&T.room)startTeacherLive();
  const s=ITEMS[T.idx];document.documentElement.style.setProperty("--stage",`var(${s.stage.c})`);
  let en=slotHTML(s,"en",T.reveal);if(s.fix&&T.reveal){const w=esc(s.fix.w[0]);en=en.replace(w,`<s>${w}</s> <mark>${esc(s.fix.r[0])}</mark>`)}
  const groups=Array.from({length:T.groups},(_,i)=>i+1);
  const auto={};if(LIVE)Object.values(tSubs).forEach(byG=>{for(const k in byG){const g=k.replace(/^g/,"");auto[g]=(auto[g]||0)+(+byG[k].pts||0)}});
  const total=g=>Math.max(0,(auto[g]||0)+(rs().score[g]||0));const max=Math.max(1,...groups.map(total));
  const now=(LIVE&&tSubs[T.code])||{};
  const joined=g=>Object.values(tMembers).filter(m=>+m.grp===g).length;
  const status=g=>{const r=now["g"+g];if(!r)return `<span class="note">제출 전</span>`;if(r.done&&r.ok)return `<span style="color:var(--ok);font-weight:700">✅ +${r.pts}</span>`;if(r.done)return `<span style="color:var(--bad);font-weight:700">❌</span>`;return `<span style="color:var(--gold);font-weight:700">재도전</span>`};
  const submitted=groups.filter(g=>now["g"+g]&&now["g"+g].done).length;
  const top=LIVE?`<div class="bigcode"><div><div style="font-size:.85rem;opacity:.9">${T.room?`반 코드 · ${tOk?"연결됨":"연결 중…"}`:"반 코드를 먼저 정하세요"}</div><b style="letter-spacing:.08em">${esc(T.room||"—")}</b></div>
      <div class="row"><span>${submitted}/${T.groups} 모둠 제출</span><button class="btn small" id="t-prev" ${T.idx===0?"disabled":""}>← 이전</button><button class="btn small" id="t-next" ${T.idx===N-1?"disabled":""}>다음 문장 →</button></div></div>`
   :`<div class="bigcode"><div><div style="font-size:.85rem;opacity:.9">열쇠 코드</div><b>${T.code}</b></div>
      <div class="row"><button class="btn small" id="t-prev" ${T.idx===0?"disabled":""}>← 이전</button><button class="btn small" id="t-next" ${T.idx===N-1?"disabled":""}>다음 문장 →</button></div></div>`;
  $("#app").innerHTML=`<div class="top"><h1>관용구 리딩 미션 · 선생님 화면</h1>
   <div class="row">${LIVE?`<label class="f" style="flex:0 0 auto;flex-direction:row;align-items:center;gap:6px">반 코드 <input class="t" id="t-room" style="width:8em" maxlength="20" value="${esc(T.room||"")}" placeholder="예: 3-2"></label><button class="btn small" id="t-room-go">적용</button>`:""}
   <label class="f" style="flex:0 0 auto;flex-direction:row;align-items:center;gap:6px">모둠 수 <select id="t-g" style="width:auto">${[4,5,6,7,8].map(n=>`<option ${n===T.groups?"selected":""}>${n}</option>`).join("")}</select></label></div></div>
  <div class="tgrid">
   <div class="stack proj">
    ${top}
    <div class="card">
      <div class="no"><span class="lv">${s.stage.n}단계 · ${esc(s.stage.title)}</span><span>${label(s)}</span>${s.star?'<span class="star">★ 핵심 문장</span>':""}</div>
      <div class="en">${en}</div>
      ${s.fix&&!T.reveal?`<div class="note">틀린 곳 한 곳을 찾아 고치세요.</div>`:""}
      ${s.ex?`<div class="ex">${slotHTML(s,"ex",T.reveal)}</div>`:""}
      ${s.ko?`<div class="ko">${slotHTML(s,"ko",T.reveal)}</div>`:""}
      ${T.reveal&&s.tip?`<div class="hint">${esc(s.tip)}</div>`:""}
      <div class="row"><button class="btn" id="t-rev">${T.reveal?"정답 숨기기":"정답 공개"}</button><button class="btn ghost small" id="t-new">${LIVE?"입력 담당 다시 뽑기":"코드 새로 만들기"}</button></div>
    </div>
    <div class="panel"><div class="nav">${STAGES.map(sg=>`<span class="sep">${sg.n}단계 ${esc(sg.title)}</span>`+ITEMS.map((it,i)=>it.stage===sg?`<button data-go="${i}" class="${i===T.idx?"cur":""} ${rs().seen.includes(i)?"seen":""}">${it.id}</button>`:"").join("")).join("")}</div></div>
   </div>
   <div class="stack">
    <div class="panel stack"><h3>모둠 점수</h3>
     <div class="score">${groups.map(g=>{const v=total(g);return `<div class="sc ${v===max&&v>0?"lead":""}"><span class="g">${g}모둠</span>
       ${LIVE?`<span class="note">${status(g)} · ${joined(g)}명 접속</span>`:`<span></span>`}
       <span class="pts">${v}</span>
       <span class="bs" style="grid-column:1/-1">${LIVE?'<span class="note" style="margin-right:auto">점수 조정</span>':""}<button data-sc="${g}" data-d="2">+2</button><button data-sc="${g}" data-d="1">+1</button><button data-sc="${g}" data-d="-1" aria-label="${g}모둠 1점 빼기">−1</button></span>
       <span class="bar" style="grid-column:1/-1"><i style="width:${v/max*100}%"></i></span></div>`}).join("")}</div>
     <span id="t-rs"><button class="btn ghost small" id="t-reset">${LIVE?"새 수업 시작 (기록·점수 지우기)":"점수 초기화"}</button></span>
    </div>
    <div class="panel note">${LIVE?"진행: 다음 문장 → 학생 화면이 자동으로 바뀜 → 모둠 토의 → 담당 학생 제출 → 여기에 ✅/❌와 점수가 자동 반영 → 정답 공개 (학생 화면에도 정답이 보여요)"
      :"진행: 문장 띄우기 → 코드 입력 → 모둠 토의 → 담당 학생 제출 → ✅ 화면 들어 보이기 → 정답 공개 → 점수 주기 (한 번에 정답 +2, 두 번째 정답 +1)"}</div>
   </div>
  </div>`;
  const go=i=>{T.idx=i;T.code=LIVE?rid():newCode(i);T.reveal=false;if(!rs().seen.includes(i))rs().seen.push(i);saveT();pushState();render();scrollTo(0,0)};
  $("#t-prev").onclick=()=>go(T.idx-1);$("#t-next").onclick=()=>go(T.idx+1);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $("#t-rev").onclick=()=>{T.reveal=!T.reveal;saveT();pushState();render()};
  $("#t-new").onclick=()=>{T.code=LIVE?rid():newCode(T.idx);saveT();pushState();render();toast(LIVE?"입력 담당을 다시 뽑았어요":"새 코드를 만들었어요. 입력 담당도 바뀝니다")};
  $("#t-g").onchange=e=>{T.groups=+e.target.value;saveT();render()};
  const rg=$("#t-room-go");if(rg)rg.onclick=async()=>{const r=$("#t-room").value.trim().toLowerCase();if(!roomOk(r)){toast("반 코드는 영어 소문자, 숫자, - 로 20자 이내");return}
    if(r===T.room){render();return}
    let st=null;try{const res=await fetch(`${FB}/rooms/${r}/state.json`);st=await res.json()}catch(e){}
    T.room=r;if(st&&st.idx!=null&&st.seed){T.idx=st.idx;T.code=st.seed;T.reveal=!!st.reveal}else{T.idx=0;T.code=rid();T.reveal=false}
    if(!rs().seen.includes(T.idx))rs().seen.push(T.idx);saveT();render();toast(st&&st.seed?`${r}: ${label(ITEMS[T.idx])}부터 이어서 진행`:`반 코드 ${r} 새로 시작`)};
  document.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const g=b.dataset.sc;rs().score[g]=(rs().score[g]||0)+ +b.dataset.d;saveT();render()});
  $("#t-reset").onclick=()=>{$("#t-rs").innerHTML=`<span class="confirm">${LIVE?"이 반의 제출 기록과 점수를 모두 지울까요?":"모든 모둠 점수를 0으로?"} <button class="btn small" id="ry">지우기</button><button class="btn ghost small" id="rn">취소</button></span>`;
    $("#ry").onclick=async()=>{rs().score={};rs().seen=[T.idx];saveT();if(LIVE&&T.room){await fdel(`rooms/${T.room}/subs`);pushState()}render()};$("#rn").onclick=render};
}
if(!rs().seen.includes(T.idx))rs().seen.push(T.idx);
startStudentLive();
render();
</script>

</html>
